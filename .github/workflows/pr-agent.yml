name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  pr-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: the-pr-agent/pr-agent@v0.41.1
        id: pr-agent
        env:
          OPENAI_KEY: ${{ secrets.OPENCODE_GO_BOOKS_API_KEY }}
          OPENAI_BASE_URL: https://opencode.ai/zen/go/v1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_AGENT_CONFIG_BRANCH: ${{ github.head_ref }}

      - name: Check review succeeded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM="${{ github.event.number }}"
          SHA="${{ github.event.pull_request.head.sha }}"
          SHORT_SHA="${SHA:0:7}"
          if [ -z "$PR_NUM" ]; then
            echo "Manual trigger — skipping review check (no PR number)"
            exit 0
          fi
          # Success = the persistent "PR Reviewer Guide" comment covers this commit.
          # A comment counts when its body references the commit SHA ("Review updated
          # until commit .../SHA") or was created after this run started (the first
          # review on a PR is posted without the SHA marker). The SHA match is the
          # primary attribution; the created-at match covers the first-review case.
          RUN_STARTED=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" --jq '.created_at' 2>/dev/null || echo "")
          REVIEW_COUNT=$(gh api "repos/${{ github.repository }}/issues/$PR_NUM/comments" --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"PR Reviewer Guide\")) and ((.body | contains(\"$SHORT_SHA\")) or (\"$RUN_STARTED\" != \"\" and .created_at >= \"$RUN_STARTED\")))] | length" 2>/dev/null || echo "0")
          if [ -n "$REVIEW_COUNT" ] && [ "$REVIEW_COUNT" -ne 0 ]; then
            echo "Review check passed"
            exit 0
          fi
          # No review for this commit. Surface what PR-Agent actually did, then fail.
          FAILURES=$(gh api "repos/${{ github.repository }}/issues/$PR_NUM/comments" --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | test("Failed to generate"; "i")))] | sort_by(.created_at) | reverse | .[0:3] | map("  " + .created_at + "  " + .body) | join("\n")' 2>/dev/null || echo "")
          echo "::error::No PR-Agent review was posted for commit $SHORT_SHA."
          if [ -n "$FAILURES" ]; then
            echo "The review step failed instead of producing a review. Recent PR-Agent failure comments:"
            echo "$FAILURES"
            echo "See the 'Run the-pr-agent/pr-agent' step logs for the underlying error."
          else
            echo "No 'PR Reviewer Guide' comment exists for this commit — the review was skipped, failed before posting, or did not complete. See the 'Run the-pr-agent/pr-agent' step logs."
          fi
          exit 1
